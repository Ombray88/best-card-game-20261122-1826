<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Duel</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0e14; font-family: system-ui, -apple-system, sans-serif; color: #f1f5f9; user-select: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: radial-gradient(circle at center, #1a2233 0%, #0c0e14 100%); }
  #ui-layer { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; }
  .interactive { pointer-events: auto; }
  button { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; border: none; padding: 10px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4); transition: transform 0.1s ease, filter 0.2s ease; }
  button:hover { filter: brightness(1.1); transform: translateY(-1px); }
  button:active { transform: translateY(1px); }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Ember Duel: turn-based mystical card battle game"></canvas>
<div id="ui-layer"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
